name: Geopolitics market summary

# Regenerate the newly-added Polymarket Geopolitics summary every 6 hours and
# publish it to GitHub Pages. The job runs entirely on GitHub's servers, so no
# computer of yours needs to stay on. The report is viewable in any browser,
# including on a phone, at your Pages URL:
#   https://<your-username>.github.io/<your-repo>/

on:
  schedule:
    - cron: '0 */6 * * *' # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

# Don't let two runs race on the committed state file / Pages deploy.
concurrency:
  group: geopolitics-summary
  cancel-in-progress: false

permissions:
  contents: write # to commit the small state file back
  pages: write # to publish to GitHub Pages
  id-token: write # required by the Pages deploy action

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the app uses only the Node standard library.
      - name: Generate summary
        run: npm run generate
        env:
          VOLUME_THRESHOLD: '3000'
          SCHEDULE_HOURS: '6'
          WINDOW_DAYS: '7'
          # GITHUB_REPOSITORY is provided automatically; the Update button uses
          # it to link back to this workflow from the published page.

      # Publish the report FIRST, so a rare race on the state commit below can
      # never block the actual deploy.
      - name: Upload report as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Persist ONLY the small state file so the next run can tell which markets
      # are newly added. This is best-effort: if the branch moved on the remote
      # since checkout (e.g. a re-run of an older run, or a concurrent push), we
      # rebase and retry, and never fail the job over it — the page is already
      # published above. The HTML report is served via Pages, not committed.
      - name: Persist screener state (best effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          git commit -m "chore: update screener state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "State pushed."
              exit 0
            fi
            echo "Push rejected (branch moved); syncing and retrying ($attempt)…"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          done
          echo "Could not push state after retries; the report is already published, so continuing."
